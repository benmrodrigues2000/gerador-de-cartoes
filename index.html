<!DOCTYPE html>
<html lang="en" data-lang="en" data-fmt="eu" data-variant="minimal" data-layout="atelier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F8F9F6">
<title>Card Studio — Make a lasting impression</title>
<meta name="description" content="Create a business card that feels like you. Six thoughtful templates, live 3D previews, local QR codes and print-ready exports. Private by design.">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23213c2c%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23dcf0b8%22%20stroke-width%3D%222.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m32%2015%2019%2010-19%2010-19-10%2019-10ZM13%2034l19%2010%2019-10M13%2043l19%2010%2019-10%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">

<style id="page-size">@page{size:85mm 55mm;margin:0}</style>
<style id="fit-vars">:root{}</style>
<link rel="stylesheet" href="assets/card-studio.css">
<link rel="stylesheet" href="assets/templates.css">
<link rel="stylesheet" href="assets/workspace.css">
</head>
<body>
<a class="skip-link" href="#workspace" data-i18n="skip_workspace">Skip to workspace</a>
<svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><symbol id="i-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 10h5M7 14h3M16 10v4"/></symbol><symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol><symbol id="i-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12"/></symbol><symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></symbol><symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/></symbol><symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol><symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol><symbol id="i-contact" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 8h16M8 12h3m-3 4h8"/></symbol><symbol id="i-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor"  stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol><symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/></symbol><symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-1 .5-1 1-1 2.2M12 17h.01"/></symbol><symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol><symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Z"/><path d="M14 3v6h6M8 13h8m-8 4h5"/></symbol><symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol><symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol><symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v6h6M3.5 10A9 9 0 1 1 3 15"/></symbol><symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3S5 1 4 11a7 7 0 0 0 7 8c10-1 9-16 9-16ZM3 21 15 9"/></symbol><symbol id="i-keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/></symbol></defs></svg>

<div class="app-bg" aria-hidden="true"></div>


<!-- =========================================================
     HEADER
     ========================================================= -->
<header class="app-header">
  <div class="header-wrap">
    <a class="brand" href="#workspace" aria-label="Card Studio home">
      <div class="brand-logo" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#i-layers"></use></svg></div>
      <div class="brand-text"><h1>card<span>studio</span><i>.</i></h1></div>
    </a>
    <nav class="main-nav" aria-label="Main navigation" data-i18n-aria="aria_navigation">
      <a class="nav-link active" href="#workspace"><span data-i18n="nav_workspace"></span></a>
      <button class="nav-link" type="button" data-open-templates><span data-i18n="nav_templates"></span></button>
    </nav>
    <div class="header-actions">
      <div id="saveStatus" class="save-status" role="status"><i></i><span></span></div>
      <div class="seg language-picker" role="group" aria-label="Language" data-i18n-aria="aria_language">
        <button type="button" data-lang-btn="en" aria-pressed="true">EN</button>
        <button type="button" data-lang-btn="pt" aria-pressed="false">PT</button>
      </div>
      <button type="button" class="btn btn-primary" id="exportBtn"><svg class="ui-icon" aria-hidden="true"><use href="#i-download"></use></svg><span data-i18n="export_card"></span></button>
    </div>
  </div>
</header>

<main class="studio-layout" id="workspace">

  <!-- =====================================================
       LEFT · EDITOR
       ===================================================== -->
  <aside class="panel form-panel">
    <div class="editor-heading">
      <div class="eyebrow"><span data-i18n="editor_eyebrow"></span><span class="step-count">01 — 04</span></div>
      <h2 data-i18n="editor_title"></h2>
      <p data-i18n="editor_description"></p>
    </div>
    <nav class="form-tabs" role="tablist" data-i18n-aria="aria_editor">
      <button type="button" class="tab-btn active" data-tab="tab-id"><svg class="tab-icon ui-icon" aria-hidden="true"><use href="#i-user"></use></svg><span data-i18n="tab_id"></span></button>
      <button type="button" class="tab-btn" data-tab="tab-net"><svg class="tab-icon ui-icon" aria-hidden="true"><use href="#i-contact"></use></svg><span data-i18n="tab_net"></span></button>
      <button type="button" class="tab-btn" data-tab="tab-style"><svg class="tab-icon ui-icon" aria-hidden="true"><use href="#i-palette"></use></svg><span data-i18n="tab_style"></span></button>
      <button type="button" class="tab-btn" data-tab="tab-print"><svg class="tab-icon ui-icon" aria-hidden="true"><use href="#i-print"></use></svg><span data-i18n="tab_print"></span></button>
    </nav>

    <div class="panel-body">

      <!-- TAB · IDENTITY -->
      <div class="tab-pane active" id="tab-id">
        <h3 class="form-section-title" data-i18n="sec_person"></h3>
        <div class="form-group">
          <label class="f-label" for="f_name" data-i18n="fld_name"></label>
          <input type="text" id="f_name" class="input-text" data-i18n-ph="ph_name" autocomplete="name">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="f-label" for="f_role" data-i18n="fld_role"></label>
            <input type="text" id="f_role" class="input-text" data-i18n-ph="ph_role">
          </div>
          <div class="form-group">
            <label class="f-label" for="f_dept" data-i18n="fld_dept"></label>
            <input type="text" id="f_dept" class="input-text" data-i18n-ph="ph_dept">
          </div>
        </div>

        <h3 class="form-section-title tab-split" data-i18n="sec_company"></h3>
        <div class="grid-2">
          <div class="form-group">
            <label class="f-label" for="f_company" data-i18n="fld_company"></label>
            <input type="text" id="f_company" class="input-text" data-i18n-ph="ph_company">
          </div>
          <div class="form-group">
            <label class="f-label" for="f_monogram" data-i18n="fld_monogram"></label>
            <input type="text" id="f_monogram" class="input-text" maxlength="4" data-i18n-ph="ph_monogram">
          </div>
        </div>
        <div class="form-group">
          <label class="f-label" for="f_tagline" data-i18n="fld_tagline"></label>
          <input type="text" id="f_tagline" class="input-text" data-i18n-ph="ph_tagline">
        </div>

        <details class="editor-disclosure">
          <summary><svg class="ui-icon" aria-hidden="true"><use href="#i-user"></use></svg><span data-i18n="photo_optional"></span><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron"></use></svg></summary>
          <div class="disclosure-body">
        <div class="upload-card">
          <div class="upload-preview" id="uploadPreviewBox"><img id="uploadPreviewImg" alt=""></div>
          <div class="upload-info">
            <span class="f-label" data-i18n="fld_photo"></span>
            <span class="hint" id="photoState"></span>
            <div class="upload-btn-wrap">
              <label class="btn btn-ghost btn-xs file-btn">
                <span data-i18n="btn_upload"></span><input type="file" id="photoInput" accept="image/*">
              </label>
              <button type="button" class="btn btn-ghost btn-xs" id="photoGrayBtn" aria-pressed="false" data-i18n="btn_gray"></button>
              <button type="button" class="btn btn-ghost btn-xs" id="photoClearBtn" data-i18n="btn_remove"></button>
            </div>
          </div>
        </div>
        <div style="margin-top:14px">
          <div class="range-row">
            <label for="f_photo_zoom" data-i18n="rng_zoom"></label>
            <input type="range" id="f_photo_zoom" min="100" max="220" step="2" value="100">
            <output id="out_photo_zoom">100%</output>
          </div>
          <div class="range-row">
            <label for="f_photo_x" data-i18n="rng_x"></label>
            <input type="range" id="f_photo_x" min="0" max="100" step="1" value="50">
            <output id="out_photo_x">50%</output>
          </div>
          <div class="range-row">
            <label for="f_photo_y" data-i18n="rng_y"></label>
            <input type="range" id="f_photo_y" min="0" max="100" step="1" value="42">
            <output id="out_photo_y">42%</output>
          </div>
        </div>
        <div class="form-group" style="margin-top:14px">
          <label class="f-label" for="f_photo_frame" data-i18n="fld_frame"></label>
          <select id="f_photo_frame" class="input-select">
            <option value="band" data-i18n="frame_band"></option>
            <option value="round" data-i18n="frame_round"></option>
            <option value="none" data-i18n="frame_none"></option>
          </select>
          <span class="hint" data-i18n="hint_frame"></span>
        </div>
</div>
        </details>
        <details class="editor-disclosure">
          <summary><svg class="ui-icon" aria-hidden="true"><use href="#i-file"></use></svg><span data-i18n="more_details"></span><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron"></use></svg></summary>
          <div class="disclosure-body">        <div class="grid-2">
          <div class="form-group">
            <label class="f-label" for="f_est" data-i18n="fld_est"></label>
            <input type="text" id="f_est" class="input-text" data-i18n-ph="ph_est">
          </div>
          <div class="form-group">
            <label class="f-label" for="f_legal" data-i18n="fld_legal"></label>
            <input type="text" id="f_legal" class="input-text" data-i18n-ph="ph_legal">
          </div>
        </div>


            <label class="f-label" for="presetSelect" data-i18n="example_content"></label>
            <select class="input-select" id="presetSelect"></select>
            <p class="hint" data-i18n="example_note"></p>
          </div>
        </details>
      </div>

      <!-- TAB · CONTACTS / SOCIALS / QR -->
      <div class="tab-pane" id="tab-net">
        <h3 class="form-section-title" data-i18n="sec_direct"></h3>
        <div class="form-group">
          <label class="f-label" for="f_email" data-i18n="fld_email"></label>
          <input type="email" id="f_email" class="input-text" data-i18n-ph="ph_email" spellcheck="false">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="f-label" for="f_phone" data-i18n="fld_phone"></label>
            <input type="tel" id="f_phone" class="input-text" data-i18n-ph="ph_phone">
          </div>
          <div class="form-group">
            <label class="f-label" for="f_mobile" data-i18n="fld_mobile"></label>
            <input type="tel" id="f_mobile" class="input-text" data-i18n-ph="ph_mobile">
          </div>
        </div>

        <h3 class="form-section-title tab-split" data-i18n="sec_web"></h3>
        <div class="grid-2">
          <div class="form-group">
            <label class="f-label" for="f_web" data-i18n="fld_web"></label>
            <input type="text" id="f_web" class="input-text" data-i18n-ph="ph_web" spellcheck="false">
          </div>
          <div class="form-group">
            <label class="f-label" for="f_qr_payload" data-i18n="fld_qr"></label>
            <select id="f_qr_payload" class="input-select">
              <option value="website" data-i18n="qr_web"></option>
              <option value="vcard" data-i18n="qr_vcard"></option>
              <option value="phone" data-i18n="qr_phone"></option>
              <option value="email" data-i18n="qr_email"></option>
            </select>
          </div>
        </div>
        <span class="hint" data-i18n="hint_qr"></span>

        <h3 class="form-section-title tab-split" data-i18n="sec_office"></h3>
        <div class="form-group">
          <label class="f-label" for="f_addr_street" data-i18n="fld_street"></label>
          <input type="text" id="f_addr_street" class="input-text" data-i18n-ph="ph_street">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="f-label" for="f_addr_city" data-i18n="fld_city"></label>
            <input type="text" id="f_addr_city" class="input-text" data-i18n-ph="ph_city">
          </div>
          <div class="form-group">
            <label class="f-label" for="f_addr_country" data-i18n="fld_country"></label>
            <input type="text" id="f_addr_country" class="input-text" data-i18n-ph="ph_country">
          </div>
        </div>

        <h3 class="form-section-title tab-split" data-i18n="sec_social"></h3>
        <div id="socialEditors"></div>
        <span class="hint" data-i18n="hint_social"></span>

        <h3 class="form-section-title tab-split" data-i18n="sec_front_lines"></h3>
        <div id="lineToggles"></div>
      </div>

      <!-- TAB · STYLE -->
      <div class="tab-pane" id="tab-style">
        <h3 class="form-section-title"><span data-i18n="sec_themes"></span> <span style="color:var(--text-dim)">15</span></h3>
        <div class="theme-grid" id="themeGrid"></div>

        <h3 class="form-section-title tab-split" data-i18n="sec_hex"></h3>
        <div class="hex-grid" id="hexGrid"></div>
        <div class="form-group" style="margin-top:12px;display:flex;gap:9px;flex-wrap:wrap">
          <button type="button" class="btn btn-ghost btn-xs" id="autoInkBtn" data-i18n="btn_auto_ink"></button>
          <button type="button" class="btn btn-ghost btn-xs" id="resetColorsBtn" data-i18n="btn_reset_colors"></button>
          <button type="button" class="btn btn-ghost btn-xs" id="randomBtn"><svg class="ui-icon" aria-hidden="true"><use href="#i-spark"></use></svg> <span data-i18n="btn_random"></span></button>
        </div>

        <h3 class="form-section-title tab-split" data-i18n="sec_fonts"></h3>
        <div class="font-grid">
          <div class="form-group">
            <label class="f-label" for="f_font_display" data-i18n="fld_font_d"></label>
            <select id="f_font_display" class="input-select"></select>
          </div>
          <div class="form-group">
            <label class="f-label" for="f_font_body" data-i18n="fld_font_b"></label>
            <select id="f_font_body" class="input-select"></select>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="f-label" for="f_name_case" data-i18n="fld_name_case"></label>
            <select id="f_name_case" class="input-select">
              <option value="none" data-i18n="case_title"></option>
              <option value="uppercase" data-i18n="case_upper"></option>
              <option value="lowercase" data-i18n="case_lower"></option>
              <option value="capitalize" data-i18n="case_cap"></option>
            </select>
          </div>
          <div class="form-group">
            <label class="f-label" for="f_weight" data-i18n="fld_weight"></label>
            <select id="f_weight" class="input-select">
              <option value="500">Medium 500</option>
              <option value="600" selected>Semibold 600</option>
              <option value="700">Bold 700</option>
            </select>
          </div>
        </div>
        <div class="range-row" style="margin-top:12px">
          <label for="f_tracking" data-i18n="rng_track"></label>
          <input type="range" id="f_tracking" min="-30" max="160" step="5" value="-10">
          <output id="out_tracking">-0.01em</output>
        </div>
        <div class="range-row">
          <label for="f_label_track" data-i18n="rng_ltrack"></label>
          <input type="range" id="f_label_track" min="0" max="320" step="10" value="160">
            <output id="out_label_track">0.16em</output>
        </div>

        <h3 class="form-section-title tab-split" data-i18n="sec_layout"></h3>
        <div class="form-group">
          <label class="f-label" data-i18n="fld_front_fill"></label>
          <div class="seg" role="group" style="width:100%;justify-content:space-between">
            <button type="button" data-set-fill="dark" aria-pressed="true" data-i18n="fill_dark"></button>

<!-- 3D MODAL -->
<div class="popout-modal" id="popoutModal" inert role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="popoutTitle">
  <button type="button" class="modal-close-btn" id="closePopoutBtn" aria-label="Close" data-i18n-aria="aria_close">✕</button>
  <div class="modal-head">
    <h2 id="popoutTitle" data-i18n="modal_title"></h2>
    <p data-i18n="modal_sub"></p>
  </div>
  <div class="stage3d" id="stage3dModal">
    <div class="grid-fade" aria-hidden="true"></div>
    <div class="floor" aria-hidden="true"></div>
    <div class="stage3d-tag"><span data-i18n="drag_hint"></span> · <b data-i18n="orbit"></b></div>
    <div class="stage3d-hint"><span data-i18n="click_turn_3d"></span></div>
    <div class="c3d-wrap">
      <div class="card3d" id="card3dModal">
        <div class="c3d-face c3d-front"><div class="face-slot" id="hostModalFront"></div><div class="c3d-glare"></div></div>
        <div class="c3d-face c3d-back"><div class="face-slot" id="hostModalBack"></div><div class="c3d-glare"></div></div>
        <div class="c3d-edge e-top"></div><div class="c3d-edge e-bot"></div>
        <div class="c3d-edge e-left"></div><div class="c3d-edge e-right"></div>
      </div>
    </div>
  </div>
  <div class="modal-actions">
    <button type="button" class="btn btn-primary" id="modalTurnBtn">↻ <span data-i18n="btn_turn"></span></button>
    <button type="button" class="btn btn-ghost" id="modalSpinBtn"><svg class="ui-icon" aria-hidden="true"><use href="#i-reset"></use></svg> <span data-i18n="btn_spin"></span></button>
    <button type="button" class="btn btn-ghost" id="modalPdfBtn"><svg class="ui-icon" aria-hidden="true"><use href="#i-print"></use></svg> <span data-i18n="btn_make_pdf"></span></button>
  </div>
</div>

<div hidden><span id="statTheme"></span><span id="statFmt"></span></div>
<!-- PRINT HOST -->
<div id="print-root" aria-hidden="true"></div>
<div id="toasts" class="toast-container" aria-live="polite"></div>

<!-- =========================================================
     APP · local rendering, QR, history and print
     ========================================================= -->

<script type="module" src="assets/app.js"></script>

</body>
</html>
